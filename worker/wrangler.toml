name = "cloudyforms-worker"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

# Import HTML email templates as text at build time
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ENVIRONMENT = "production"
EMAIL_FROM = "CloudyForms <noreply@thecuckoocamp.co.uk>"
# Comma-separated list of allowed CORS origins for the management API.
# Use "*" to allow all (fine for public deployments; tighten in production).
# Embed/public routes always allow cross-origin requests regardless of this value.
ALLOWED_ORIGINS = "*"
# Email: Cloudflare Email Service (EMAIL binding) or Mailchannels per org/platform.
# Optional secrets:
#   wrangler secret put MAILCHANNELS_API_KEY   # Mailchannels orgs
#   wrangler secret put EMAIL_API_TOKEN        # Cloudflare REST fallback
#   wrangler secret put CF_ACCOUNT_ID
# See docs/EMAIL.md.

[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "cloudyforms"
database_id = "0eb3a121-b2fc-45f9-bd8b-81ac4d3cb6a5"

[[r2_buckets]]
binding = "R2"
bucket_name = "cloudyforms-files"

[dev]
port = 8787
