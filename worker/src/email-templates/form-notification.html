<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New response — {{formTitle}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:36px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
          <tr>
            <td align="center" style="padding:24px 28px 8px;">
              {{logoBlock}}
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 0;background-color:{{primaryColor}};">
              <h1 style="margin:0;padding:20px 0;font-size:20px;line-height:1.3;font-weight:600;color:#ffffff;">New form response</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px;">
              <p style="margin:0 0 12px;font-size:16px;line-height:1.55;color:#374151;">
                A new response was submitted for <strong>{{formTitle}}</strong>{{submitterLine}}.
              </p>
              <p style="margin:0 0 20px;font-size:13px;color:#6b7280;">
                Response ID: <code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;">{{responseId}}</code>
              </p>
              {{fieldRows}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 24px;border-top:1px solid #e5e7eb;">
              <p style="margin:0;font-size:12px;color:#9ca3af;">{{orgName}} · CloudyForms</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
